# /etc/nginx/sites-available/ravix  —  قبل از استفاده example.com را عوض کنید.
# گواهی SSL را certbot می‌سازد (راهنما: docs/deployment.md)؛ تا آن زمان این فایل فقط HTTP را سرو می‌کند.
limit_req_zone $binary_remote_addr zone=ravix_login:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=ravix_checkout:10m rate=30r/m;
limit_req_zone $binary_remote_addr zone=ravix_themeup:10m rate=6r/m;
limit_req_zone $binary_remote_addr zone=ravix_install:10m rate=10r/m;

upstream ravix_app {
    server unix:/run/ravix/gunicorn.sock fail_timeout=0;
}

server {
    listen 80;
    listen [::]:80;
    server_name example.com www.example.com;

    client_max_body_size 6m;           # پیش‌فرض (فرم‌ها)؛ آپلود فایل فقط در دو مسیر زیر سقف بالاتر دارد
    server_tokens off;
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 512;

    # فایل‌های استاتیک (نام هش‌دار ← کش یک‌ساله)
    location /static/ {
        alias /srv/ravix/app/staticfiles/;
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options nosniff;
    }

    # فایل‌های آپلودشده؛ هرگز اجرا نمی‌شوند و CSP بسته دارند
    location /media/ {
        alias /srv/ravix/media/;
        expires 30d;
        add_header Cache-Control "public";
        add_header X-Content-Type-Options nosniff;
        add_header Content-Security-Policy "default-src 'none'; img-src 'self'; style-src 'none'; sandbox";
        location ~* \.(php|py|pl|cgi|sh|html?|js)$ { return 403; }
    }

    # آپلود رسانه (سقف برنامه: ویدیو ۵۰MB) و فایل دیجیتال فروشگاه (RAVIX_SHOP_DIGITAL_MAX_BYTES، پیش‌فرض ۲۰۰MB). اگر فروشگاه ندارید، دومی را حذف کنید.
    location /panel/media/ {
        client_max_body_size 60m;
        include /etc/nginx/ravix-proxy.conf;
    }
    location /panel/shop/ {
        client_max_body_size 210m;
        include /etc/nginx/ravix-proxy.conf;
    }

    location = /accounts/login/ {
        limit_req zone=ravix_login burst=10 nodelay;
        include /etc/nginx/ravix-proxy.conf;
    }
    # بارگذاری قالب ZIP از پنل (سقف برنامه: ۱۰ مگابایت؛ Nginx کمی بیشتر برای سربار multipart). فقط وقتی RAVIX_THEME_WEB_INSTALL=true کار می‌کند.
    location = /panel/themes/upload/ {
        client_max_body_size 11m;
        limit_req zone=ravix_themeup burst=3 nodelay;
        include /etc/nginx/ravix-proxy.conf;
    }
    # صفحهٔ نصب (تا ساخته‌شدن مدیرکل؛ بعد ۴۰۴): محدودیت نرخ برای حدس توکن
    location = /install/ {
        limit_req zone=ravix_install burst=5 nodelay;
        include /etc/nginx/ravix-proxy.conf;
    }
    location = /shop/checkout/ {
        limit_req zone=ravix_checkout burst=10 nodelay;
        include /etc/nginx/ravix-proxy.conf;
    }
    location / {
        include /etc/nginx/ravix-proxy.conf;
    }
}
# پس از اجرای «certbot --nginx -d example.com -d www.example.com» certbot بلاک 443 و ریدایرکت HTTP→HTTPS را خودش اضافه می‌کند.
