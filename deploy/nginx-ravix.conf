# /etc/nginx/sites-available/ravix  —  قبل از استفاده example.com را عوض کنید.
# گواهی SSL را certbot می‌سازد (راهنما: docs/deployment.md)؛ تا آن زمان این فایل فقط HTTP را سرو می‌کند.
limit_req_zone $binary_remote_addr zone=ravix_login:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=ravix_checkout:10m rate=30r/m;
limit_req_zone $binary_remote_addr zone=ravix_themeup:10m rate=6r/m;
limit_req_zone $binary_remote_addr zone=ravix_install:10m rate=10r/m;

# Static files: ManifestStaticFilesStorage puts a 12-hex-digit content hash in every name the pages use (app.0a1b2c3d4e5f.css), so such a
# URL can never change content: one year, immutable. A name without a hash (a plain URL someone typed or an old link) must stay
# revalidatable, otherwise a browser could keep an outdated copy for a year.
map $uri $ravix_static_cache {
    default                                    "public, max-age=3600";
    "~\.[0-9a-f]{12}\.[A-Za-z0-9]+$"            "public, max-age=31536000, immutable";
}

upstream ravix_app {
    server unix:/run/ravix/gunicorn.sock fail_timeout=0;
    keepalive 16;                      # reuse connections to Gunicorn (with proxy_http_version 1.1 in ravix-proxy.conf)
    keepalive_timeout 55s;             # shorter than Gunicorn's keepalive (65 s): Gunicorn never closes a connection nginx still reuses
    keepalive_requests 1000;
}

server {
    listen 80;
    listen [::]:80;
    server_name example.com www.example.com;

    client_max_body_size 6m;           # پیش‌فرض (فرم‌ها)؛ آپلود فایل فقط در دو مسیر زیر سقف بالاتر دارد
    server_tokens off;

    # اتصال‌های پایدار با مرورگر (HTTP/2 روی همان اتصال چند درخواست می‌برد؛ پس از certbot، install.sh «http2» را روشن می‌کند)
    keepalive_timeout 65s;
    keepalive_requests 1000;

    # فشرده‌سازی: متن (HTML پویا هم)؛ تصویرهای JPEG/PNG/WebP و فونت woff2 از پیش فشرده‌اند و عمداً در فهرست نیستند
    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 512;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/json application/manifest+json
               application/xml application/rss+xml application/atom+xml image/svg+xml image/x-icon;

    # فایل‌های استاتیک: نام هش‌دار ← یک سال و immutable؛ بدون هش ← یک ساعت (نگاشت $ravix_static_cache در بالا)
    location /static/ {
        alias /srv/ravix/app/staticfiles/;
        add_header Cache-Control $ravix_static_cache;
        add_header X-Content-Type-Options nosniff;
    }

    # فایل‌های آپلودشده؛ هرگز اجرا نمی‌شوند و CSP بسته دارند. ۳۰ روز، با ETag/Last-Modified برای بررسی ارزان بعد از آن
    # (نام فایل آپلودی هرگز عوض‌شدنی نیست: نام تکراری پسوند تصادفی می‌گیرد؛ immutable نیست چون مدیر می‌تواند فایل را حذف کند)
    location /media/ {
        alias /srv/ravix/media/;
        add_header Cache-Control "public, max-age=2592000";
        add_header X-Content-Type-Options nosniff;
        add_header Content-Security-Policy "default-src 'none'; img-src 'self'; style-src 'none'; sandbox";
        location ~* \.(php|py|pl|cgi|sh|html?|js)$ { return 403; }
    }

    # آپلود رسانه (سقف برنامه: ویدیو ۵۰MB) و فایل دیجیتال فروشگاه (RAVIX_SHOP_DIGITAL_MAX_BYTES، پیش‌فرض ۲۰۰MB). اگر فروشگاه ندارید، دومی را حذف کنید.
    location /panel/media/ {
        client_max_body_size 60m;
        include /etc/nginx/ravix-proxy.conf;
    }
    # Private plugin files: reachable only through X-Accel-Redirect from the application (never directly), always as a download.
    location /_plugin_files/ {
        internal;
        alias /srv/ravix/plugin_data/;
        add_header X-Content-Type-Options nosniff;
        add_header Content-Security-Policy "default-src 'none'; sandbox";
    }
    # Plugin pages in the panel may take file uploads (a plugin sets its own, lower, cap in the application).
    location /panel/plugins/x/ {
        client_max_body_size 210m;
        include /etc/nginx/ravix-proxy.conf;
    }
    location /panel/shop/ {
        client_max_body_size 210m;
        include /etc/nginx/ravix-proxy.conf;
    }

    location = /accounts/login/ {
        limit_req zone=ravix_login burst=10 nodelay;
        include /etc/nginx/ravix-proxy.conf;
    }
    # بارگذاری قالب ZIP از پنل (سقف برنامه: ۱۰ مگابایت؛ Nginx کمی بیشتر برای سربار multipart). فقط وقتی RAVIX_THEME_WEB_INSTALL=true کار می‌کند.
    location = /panel/themes/upload/ {
        client_max_body_size 11m;
        limit_req zone=ravix_themeup burst=3 nodelay;
        include /etc/nginx/ravix-proxy.conf;
    }
    # صفحهٔ نصب (تا ساخته‌شدن مدیرکل؛ بعد ۴۰۴): محدودیت نرخ برای حدس توکن
    location = /install/ {
        limit_req zone=ravix_install burst=5 nodelay;
        include /etc/nginx/ravix-proxy.conf;
    }
    location = /shop/checkout/ {
        limit_req zone=ravix_checkout burst=10 nodelay;
        include /etc/nginx/ravix-proxy.conf;
    }
    location / {
        include /etc/nginx/ravix-proxy.conf;
    }
}
# پس از اجرای «certbot --nginx -d example.com -d www.example.com» certbot بلاک 443 و ریدایرکت HTTP→HTTPS را خودش اضافه می‌کند.
