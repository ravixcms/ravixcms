name: CI
on:
  push: { branches: [main] }
  pull_request:
  schedule: [{ cron: "0 5 * * 1" }]   # هفتگی: آسیب‌پذیری تازهٔ وابستگی‌ها حتی بدون commit
  workflow_call:                       # release.yml همین مجموعه را پیش از ساخت بسته اجرا می‌کند
  workflow_dispatch:
permissions: { contents: read }
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DJANGO_SECRET_KEY: ci-only-not-a-secret-ci-only-not-a-secret
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  migrations:
    name: Migrations (جاافتاده؟)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.13", cache: pip, cache-dependency-path: requirements.lock }
      - run: pip install -r requirements.lock
      # اگر مدل عوض شده و migration آن commit نشده، این مرحله شکست می‌خورد و تفاوت را چاپ می‌کند.
      - name: makemigrations --check
        run: python manage.py makemigrations --check --dry-run --verbosity 3
      - name: manage.py check
        run: python manage.py check

  test:
    name: Test (py${{ matrix.python }}, ${{ matrix.db }}${{ matrix.shop == 'false' && ', بدون فروشگاه' || '' }}${{ matrix.studio == 'false' && ', بدون Studio' || '' }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]   # 3.11 = the oldest version a shared host offers; 3.10 is end of life
        db: [sqlite, postgres]
        shop: ["true"]
        studio: ["true"]
        include:
          - { python: "3.13", db: sqlite, shop: "false", studio: "true" }   # ماژول فروشگاه اختیاری است؛ بدون آن هم باید سالم باشد
          - { python: "3.13", db: sqlite, shop: "true", studio: "false" }   # Ravix Studio اختیاری است؛ بدون آن هم باید سالم باشد
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_USER: ravix, POSTGRES_PASSWORD: ci-only-password, POSTGRES_DB: ravix }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ravix" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      RAVIX_SHOP_ENABLED: ${{ matrix.shop }}
      RAVIX_STUDIO_ENABLED: ${{ matrix.studio }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "${{ matrix.python }}", cache: pip, cache-dependency-path: requirements.lock }
      - run: pip install -r requirements.lock
      # پوشه‌هایی که برنامه روی سرور واقعی دارد (در مخزن نیستند چون در .gitignore‌اند)
      - name: پوشه‌های اجرایی
        run: mkdir -p plugins_installed plugin_backups media staticfiles
      - name: DATABASE_URL (PostgreSQL 16)
        if: matrix.db == 'postgres'
        run: echo "DATABASE_URL=postgres://ravix:ci-only-password@localhost:5432/ravix" >> "$GITHUB_ENV"
      - name: نسخهٔ موتور دیتابیس
        run: python manage.py shell -c "from django.db import connection as c; print(c.vendor, getattr(c, 'pg_version', ''))"
      - name: Tests (سریال؛ آزمون‌ها پایگاه‌داده و کش را مشترک می‌گیرند)
        run: python manage.py test --verbosity 1
      # preflight با تنظیمات تولید، روی PostgreSQL واقعی. بررسی‌های مخصوص سرور (systemd، تایمرها، پوشه‌ها) در حالت --ci هشدارند؛
      # بررسی‌های پیکربندی و امنیت (DEBUG، SECRET_KEY، HTTPS، HSTS، کوکی Secure، PostgreSQL، مهاجرت‌ها) همچنان خطا می‌دهند.
      - name: preflight (حالت CI)
        if: matrix.db == 'postgres' && matrix.shop == 'true'
        env:
          DJANGO_SETTINGS_MODULE: config.settings.production
          DJANGO_ALLOWED_HOSTS: example.com
          RAVIX_CI: "1"
        run: |
          mkdir -p plugins_installed plugin_backups media staticfiles
          export RAVIX_CACHE_DIR="$RUNNER_TEMP/ravix-cache"; mkdir -p "$RAVIX_CACHE_DIR"
          python manage.py migrate --noinput -v 0
          python manage.py ravix_preflight --ci

  # Ubuntu 24.04 is pinned above so a runner-image upgrade cannot turn the whole CI red. This job checks the NEXT image on purpose:
  # if Ubuntu 26.04 breaks something, only this job goes red and tells us before the servers move.
  ubuntu-2604:
    name: "سازگاری با Ubuntu 26.04 (Test SQLite + preflight)"
    if: github.event_name != 'workflow_call'   # a compatibility probe must not block a release
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.13", cache: pip, cache-dependency-path: requirements.lock }
      - run: pip install -r requirements.lock
      - run: mkdir -p plugins_installed plugin_backups media staticfiles
      - run: lsb_release -ds; python --version; systemctl --version | head -1
      - name: makemigrations --check
        run: python manage.py makemigrations --check --dry-run
      - name: Tests (SQLite)
        run: python manage.py test --verbosity 1
      - name: preflight (حالت CI، SQLite)
        env:
          DJANGO_SETTINGS_MODULE: config.settings.production
          DJANGO_ALLOWED_HOSTS: example.com
          RAVIX_CI: "1"
          RAVIX_ALLOW_SQLITE_IN_PRODUCTION: "true"
          RAVIX_CI_ALLOW_SQLITE: "1"   # this probe has no PostgreSQL; the single "database is sqlite" error becomes a warning (all other checks stay strict)
        run: |
          export RAVIX_CACHE_DIR="$RUNNER_TEMP/ravix-cache"; mkdir -p "$RAVIX_CACHE_DIR"
          python manage.py migrate --noinput -v 0
          python manage.py ravix_preflight --ci

  test-mariadb:
    name: Test (py3.13, MariaDB 10.11)
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    services:
      mariadb:
        image: mariadb:10.11
        env: { MARIADB_ROOT_PASSWORD: ci-only-password, MARIADB_DATABASE: ravix }
        ports: ["3306:3306"]
        options: >-
          --health-cmd "healthcheck.sh --connect --innodb_initialized" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DATABASE_URL: mysql://root:ci-only-password@127.0.0.1:3306/ravix
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.13", cache: pip, cache-dependency-path: requirements.lock }
      - run: pip install -r requirements.lock
      - run: mkdir -p plugins_installed plugin_backups media staticfiles
      - name: Database engine
        run: python manage.py shell -c "from django.db import connection as c; print(c.vendor, c.mysql_server_info)"
      - name: Tests (utf8mb4, index lengths, emulated conditional uniques)
        run: python manage.py test --verbosity 1

  shared-hosting:
    name: "Shared hosting (py3.11, MariaDB, no root, no Redis, no systemd)"
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      mariadb:
        image: mariadb:10.11
        env: { MARIADB_ROOT_PASSWORD: ci-only-password }
        ports: ["3306:3306"]
        options: >-
          --health-cmd "healthcheck.sh --connect --innodb_initialized" --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      # The package is built by the runner user (it needs the requirements to collect static files) ...
      - name: Build the cPanel package (wheels only, no gunicorn, no psycopg)
        run: |
          python -m venv "$RUNNER_TEMP/build-venv"
          "$RUNNER_TEMP/build-venv/bin/pip" install --only-binary=:all: -r requirements-cpanel.txt
          if "$RUNNER_TEMP/build-venv/bin/pip" list | grep -i -E '^(gunicorn|psycopg)'; then echo "VPS-only packages leaked into the cPanel requirements"; exit 1; fi
          "$RUNNER_TEMP/build-venv/bin/python" scripts/build_cpanel_zip.py --out "$RUNNER_TEMP/dist"
          ls -l "$RUNNER_TEMP/dist"
      # ... and installed by another user, as on a real host: its own virtualenv in its own home folder (what cPanel's "Setup Python App" creates).
      # /home/runner is not readable by other users on GitHub's runners, so everything the host user needs is copied into its home.
      - name: Host user with its own virtualenv
        run: |
          sudo useradd -m hostuser
          sudo install -d -o hostuser -g hostuser -m 755 /home/hostuser/work
          sudo cp -r scripts requirements-cpanel.txt /home/hostuser/work/
          sudo cp "$RUNNER_TEMP"/dist/ravix-*-cpanel.zip /home/hostuser/work/ravix-cpanel.zip
          sudo chown -R hostuser:hostuser /home/hostuser/work
          PYBIN="$(command -v python)"
          cd /tmp   # the runner's workspace is not enterable by another user (sudo keeps the current folder)
          sudo -H -u hostuser "$PYBIN" -m venv /home/hostuser/virtualenv/ravix
          sudo -H -u hostuser /home/hostuser/virtualenv/ravix/bin/pip install --only-binary=:all: -r /home/hostuser/work/requirements-cpanel.txt
          sudo -H -u hostuser /home/hostuser/virtualenv/ravix/bin/python --version
      - name: Database and user (like cPanel MySQL Databases)
        run: |
          mysql -h127.0.0.1 -uroot -pci-only-password -e "CREATE DATABASE ravix_e2e CHARACTER SET utf8mb4; CREATE USER 'ravix'@'%' IDENTIFIED BY 'ci-only-password'; GRANT ALL ON ravix_e2e.* TO 'ravix'@'%'; FLUSH PRIVILEGES;"
      # Runs as an ordinary user, through passenger_wsgi.py (a Passenger-like supervisor), web installer end to end, ravix_cron, the page cache.
      - name: End-to-end (web installer, ravix_cron, cache, privacy)
        run: |
          cd /tmp
          sudo -H -u hostuser /home/hostuser/virtualenv/ravix/bin/python /home/hostuser/work/scripts/e2e_shared_hosting.py --zip /home/hostuser/work/ravix-cpanel.zip --db "mysql://ravix:ci-only-password@127.0.0.1:3306/ravix_e2e"
      - name: End-to-end in a sub-folder (example.com/site/)
        run: |
          mysql -h127.0.0.1 -uroot -pci-only-password -e "DROP DATABASE ravix_e2e; CREATE DATABASE ravix_e2e CHARACTER SET utf8mb4;"
          cd /tmp
          sudo -H -u hostuser /home/hostuser/virtualenv/ravix/bin/python /home/hostuser/work/scripts/e2e_shared_hosting.py --zip /home/hostuser/work/ravix-cpanel.zip --mount /site --db "mysql://ravix:ci-only-password@127.0.0.1:3306/ravix_e2e"

  e2e-postgres:
    name: "E2E (PostgreSQL 16؛ پشتیبان/بازیابی و به‌روزرسانی)"
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_USER: ravix, POSTGRES_PASSWORD: ci-only-password }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ravix" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      E2E_PG_URL: postgresql://ravix:ci-only-password@localhost:5432
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.13", cache: pip, cache-dependency-path: requirements.lock }
      - name: ابزار کلاینت PostgreSQL (pg_dump/pg_restore باید هم‌نسخهٔ سرور ۱۶ باشند)
        run: scripts/ci_pg_client.sh   # PGDG یا ابزارهای ایمیج postgres:16؛ بستهٔ پیش‌فرض اوبونتوی تازه ممکن است postgresql-client-16 نداشته باشد
      - run: pip install -r requirements.lock
      - run: python scripts/e2e_backup_restore.py
      - run: python scripts/e2e_updater.py

  hash-lock:
    name: "قفل هش‌دار روی پایتون ${{ matrix.python }} (نصب تمیز با --require-hashes)"
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "${{ matrix.python }}" }
      - name: venv تمیز + دقیقاً دستوری که install.sh اجرا می‌کند
        run: |
          python -m venv /tmp/lockvenv
          /tmp/lockvenv/bin/pip install --disable-pip-version-check --no-cache-dir --require-hashes -r requirements.hashes.lock
          /tmp/lockvenv/bin/pip check
      - name: نصب فقط‌چرخ (همان دستور به‌روزرسانی امن)
        run: |
          python -m venv /tmp/lockvenv2
          /tmp/lockvenv2/bin/pip install --disable-pip-version-check --no-cache-dir --require-hashes --only-binary=:all: -r requirements.hashes.lock
      - name: همهٔ بسته‌ها بارگذاری می‌شوند
        run: /tmp/lockvenv/bin/python -c "import django, rest_framework, psycopg, PIL, cryptography, argon2, nh3, markdown, jdatetime, whitenoise, pymysql, dotenv, gunicorn, typing_extensions; print('imports ok')"

  # Ravix must start on a developer's Windows laptop (python manage.py runserver). Linux-only modules (fcntl, pwd, grp) once stopped it.
  # This job installs, migrates SQLite, runs check, starts the real runserver and asks /healthz, and runs a base set of tests there.
  windows:
    name: "ویندوز (نصب، migrate، check، runserver، تست‌های پایه)"
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.13", cache: pip, cache-dependency-path: requirements.lock }
      - name: pip install
        shell: pwsh
        run: |
          python -m pip install -r requirements.lock
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip check
          exit $LASTEXITCODE
      - name: check و migrate روی SQLite
        shell: pwsh
        run: |
          python manage.py check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python manage.py migrate --noinput -v 0
          exit $LASTEXITCODE
      - name: runserver واقعی و /healthz
        shell: pwsh
        run: |
          $p = Start-Process -FilePath python -ArgumentList "manage.py","runserver","--noreload","127.0.0.1:8123" -PassThru -RedirectStandardOutput runserver.out -RedirectStandardError runserver.err
          $ok = $false
          foreach ($i in 1..40) {
            Start-Sleep -Seconds 2
            try { $r = Invoke-WebRequest -UseBasicParsing -Uri http://127.0.0.1:8123/healthz; if ($r.StatusCode -eq 200) { $ok = $true; break } } catch { }
            if ($p.HasExited) { break }
          }
          Get-Content runserver.err -ErrorAction SilentlyContinue | Select-Object -Last 30
          if (-not $p.HasExited) { Stop-Process -Id $p.Id -Force }
          if (-not $ok) { Write-Error "runserver did not answer /healthz with 200"; exit 1 }
          if ((Get-Content runserver.err -Raw) -match "Traceback") { Write-Error "Traceback in runserver output"; exit 1 }
      - name: تست‌های پایه (قفل فایل، حساب‌ها، امضا)
        shell: pwsh
        run: |
          python manage.py test apps.core.tests.test_filelock apps.accounts apps.updater.tests.test_sources --verbosity 1
          exit $LASTEXITCODE

  server-migration:
    name: "مهاجرت سرور واقعی (systemd، PostgreSQL، nginx؛ install.sh قدیمی ← جدید)"
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      E2E_OLD_REF: 2c9c074   # the release the production server runs; its own install.sh installs it first
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }   # the old release is taken from the git history
      - uses: actions/setup-python@v5
        with: { python-version: "3.13", cache: pip, cache-dependency-path: requirements.lock }
      - run: pip install -r requirements.lock   # builds and signs the test releases
      # The runner image ships PostgreSQL/Apache stopped or half-configured: start from what install.sh itself sets up.
      - name: free port 80 and the default PostgreSQL cluster
        run: sudo systemctl disable --now apache2 postgresql nginx || true
      - name: old install.sh -> real data -> new install.sh -> real updates and failures (real systemd)
        run: sudo -E env "PATH=$PATH" python scripts/e2e_server_migration.py --old-ref "$E2E_OLD_REF"

  e2e-studio:
    name: "E2E مرورگر (Ravix Studio، Chromium)"
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.13", cache: pip, cache-dependency-path: requirements.lock }
      - run: pip install -r requirements.lock playwright
      - run: playwright install --with-deps chromium
      - run: python scripts/e2e_studio.py
      - name: E2E صفحه‌های حساب (ثبت‌نام با CAPTCHA، تأیید ایمیل، ورود)
        run: python scripts/e2e_accounts.py
      - name: E2E سرور MCP با SDK رسمی (OAuth، هر دو نسل پروتکل، قطع اتصال)
        run: |
          python -m venv "$RUNNER_TEMP/mcpvenv"
          "$RUNNER_TEMP/mcpvenv/bin/pip" install "mcp>=2,<3" playwright
          "$RUNNER_TEMP/mcpvenv/bin/playwright" install --with-deps chromium
          RAVIX_PYTHON="$(command -v python)" "$RUNNER_TEMP/mcpvenv/bin/python" scripts/e2e_mcp.py
      - name: Lighthouse موبایل (صفحهٔ نمونهٔ Studio، حداقل ۹۰)
        run: python scripts/lighthouse_studio.py

  security:
    name: امنیت (pip-audit، bandit، check --deploy)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.13", cache: pip, cache-dependency-path: requirements.lock }
      - run: pip install -r requirements.lock pip-audit bandit
      # نسخه‌های پین‌شده را با پایگاه آسیب‌پذیری‌ها می‌سنجد. شکست یعنی نسخه‌ای با CVE شناخته‌شده پین شده است.
      - name: pip-audit
        run: pip-audit -r requirements.lock --no-deps --disable-pip --strict
      # فقط یافتهٔ تازه (Medium به بالا) نسبت به .bandit-baseline.json شکست می‌دهد؛ برای پذیرش یک یافته، پس از بازبینی: scripts/bandit_check.sh --update
      - name: bandit
        run: scripts/bandit_check.sh
      - name: check --deploy
        env:
          DJANGO_SETTINGS_MODULE: config.settings.production
          DJANGO_ALLOWED_HOSTS: example.com
          DATABASE_URL: postgres://u:p@localhost/db
          RAVIX_CACHE_DIR: ${{ runner.temp }}/ravix-cache   # the runner user cannot write to /var/cache; settings never create folders
        run: |
          DJANGO_SECRET_KEY="$(python -c 'import secrets;print(secrets.token_urlsafe(60))')" \
          python manage.py check --deploy --fail-level WARNING

  secrets:
    name: راز جاافتاده (gitleaks، کل تاریخچه)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: دریافت gitleaks با بررسی checksum
        run: |
          v=8.21.2
          curl -sSfL -o gl.tgz "https://github.com/gitleaks/gitleaks/releases/download/v${v}/gitleaks_${v}_linux_x64.tar.gz"
          echo "5bc41815076e6ed6ef8fbecc9d9b75bcae31f39029ceb55da08086315316e3ba  gl.tgz" | sha256sum -c -
          tar -xzf gl.tgz gitleaks
      - name: اسکن تاریخچه
        run: ./gitleaks git --no-banner --redact -c .gitleaks.toml .

  docker-build:
    name: Docker image (ساخت و بررسی)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          push: false
          tags: ravix:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: image سالم بالا می‌آید
        run: |
          docker run --rm -e DJANGO_SECRET_KEY="$(python3 -c 'import secrets;print(secrets.token_urlsafe(60))')" \
            -e DJANGO_ALLOWED_HOSTS=example.com -e DATABASE_URL=postgres://u:p@localhost/db ravix:ci \
            python manage.py check
      - name: image با کاربر غیر root اجرا می‌شود
        run: test "$(docker run --rm --entrypoint id ravix:ci -u)" != "0"
