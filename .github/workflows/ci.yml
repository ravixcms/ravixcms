name: CI
on:
  push: { branches: [main] }
  pull_request:
  schedule: [{ cron: "0 5 * * 1" }]
permissions: { contents: read }
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        db: [sqlite, postgres]
        shop: ["true", "false"]
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_USER: ravin, POSTGRES_PASSWORD: ci-only-password, POSTGRES_DB: ravin }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ravin" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      RAVIN_SHOP_ENABLED: ${{ matrix.shop }}
      DJANGO_SECRET_KEY: ci-only-not-a-secret-ci-only-not-a-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.13", cache: pip }
      - run: pip install -r requirements.lock
      - name: DATABASE_URL (postgres)
        if: matrix.db == 'postgres'
        run: echo "DATABASE_URL=postgres://ravin:ci-only-password@localhost:5432/ravin" >> "$GITHUB_ENV"
      - run: python manage.py makemigrations --check --dry-run
      - name: Tests
        run: |
          if [ "${{ matrix.shop }}" = "true" ]; then python manage.py test --parallel 4; else python manage.py test; fi
  e2e-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_USER: ravin, POSTGRES_PASSWORD: ci-only-password }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ravin" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.13", cache: pip }
      - run: pip install -r requirements.lock
      - run: E2E_PG_URL='postgresql://ravin:ci-only-password@localhost:5432' python scripts/e2e_backup_restore.py
      - run: E2E_PG_URL='postgresql://ravin:ci-only-password@localhost:5432' python scripts/e2e_updater.py
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.13" }
      - run: pip install pip-audit && pip-audit -r requirements.lock
      - name: check --deploy
        run: |
          pip install -r requirements.lock
          DJANGO_SETTINGS_MODULE=config.settings.production DJANGO_SECRET_KEY="$(python -c 'import secrets;print(secrets.token_urlsafe(60))')" \
          DJANGO_ALLOWED_HOSTS=example.com DATABASE_URL=postgres://u:p@localhost/db python manage.py check --deploy --fail-level WARNING
