name: Release
# با هر تگ vX.Y.Z (یا vX.Y.Z-rc1): آزمون کامل ← بستهٔ zip + SHA256SUMS ← image داکر روی GHCR ← GitHub Release.
# امضای دیجیتال عمداً اینجا انجام نمی‌شود: کلید خصوصی ناشر هرگز وارد CI نمی‌شود (docs/release.md §امضای آفلاین).
on:
  push: { tags: ["v[0-9]+.[0-9]+.[0-9]+*"] }
permissions: { contents: read }
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  preflight:
    name: تگ، نسخه و CHANGELOG
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.v.outputs.version }}
      prerelease: ${{ steps.v.outputs.prerelease }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - id: v
        run: |
          code=$(python3 -c "import re;print(re.search(r'RAVIX_VERSION = \"([^\"]+)\"',open('apps/core/version.py').read()).group(1))")
          tag="${GITHUB_REF_NAME#v}"
          [ "${tag%%-*}" = "$code" ] || { echo "::error::تگ $GITHUB_REF_NAME با RAVIX_VERSION=$code نمی‌خواند"; exit 1; }
          grep -qE "^## \[${code//./\\.}\]" CHANGELOG.md || { echo "::error::CHANGELOG.md بخش «## [$code]» ندارد"; exit 1; }
          echo "version=$tag" >> "$GITHUB_OUTPUT"
          case "$tag" in *-*) echo "prerelease=true" >> "$GITHUB_OUTPUT";; *) echo "prerelease=false" >> "$GITHUB_OUTPUT";; esac
      - name: تگ روی main است
        run: |
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "::error::commit تگ در تاریخچهٔ main نیست"; exit 1; }

  ci:
    name: آزمون و بررسی‌های امنیتی
    needs: preflight
    uses: ./.github/workflows/ci.yml

  package:
    name: بستهٔ zip و checksum
    needs: [preflight, ci]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with: { python-version: "3.13" }
      - name: ساخت (TZ=UTC برای هش تکرارپذیر)
        run: |
          name="ravix-${{ needs.preflight.outputs.version }}"
          mkdir -p dist && TZ=UTC git archive --format=zip --prefix="$name/" -o "dist/$name.zip" HEAD
          (cd dist && sha256sum "$name.zip" > SHA256SUMS)
      - name: راستی‌آزمایی بسته و checksum
        run: |
          name="ravix-${{ needs.preflight.outputs.version }}"
          (cd dist && sha256sum -c SHA256SUMS)
          python scripts/verify_release.py "dist/$name.zip" --version "${{ needs.preflight.outputs.version }}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with: { name: dist, path: dist/*, if-no-files-found: error }

  docker:
    name: image داکر (GHCR)
    needs: [preflight, ci]
    runs-on: ubuntu-24.04
    permissions: { contents: read, packages: write }
    outputs:
      digest: ${{ steps.push.outputs.digest }}
      image: ${{ steps.meta.outputs.tags }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ghcr.io/${{ github.repository }}
          # latest فقط برای نسخهٔ پایدار؛ rc/beta فقط با برچسب نسخهٔ خودشان
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}},enable=${{ needs.preflight.outputs.prerelease == 'false' }}
            type=raw,value=latest,enable=${{ needs.preflight.outputs.prerelease == 'false' }}
      - id: push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: true
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    name: GitHub Release
    needs: [preflight, package, docker]
    runs-on: ubuntu-24.04
    permissions: { contents: write }
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with: { name: dist, path: dist }
      - name: متن Release
        run: |
          {
            echo "## بررسی دانلود"
            echo '```'
            echo 'sha256sum -c SHA256SUMS'
            echo '```'
            echo "فایل \`SHA256SUMS\` فقط **یکپارچگی دانلود** را تضمین می‌کند؛ این Release با کلید ناشر **امضا نشده** است (امضا دستی و آفلاین انجام می‌شود؛ docs/release.md)."
            echo
            echo "## image داکر"
            echo "\`ghcr.io/${GITHUB_REPOSITORY,,}:${{ needs.preflight.outputs.version }}\` — digest: \`${{ needs.docker.outputs.digest }}\`"
          } > notes.md
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          files: |
            dist/*.zip
            dist/SHA256SUMS
          body_path: notes.md
          generate_release_notes: true
          prerelease: ${{ needs.preflight.outputs.prerelease == 'true' }}
          fail_on_unmatched_files: true
