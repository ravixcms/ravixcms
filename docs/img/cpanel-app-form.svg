<style>.b{fill:#f4f6fb;stroke:#4a5bd8;stroke-width:1.5}.t{fill:#1c2340}.m{fill:#5b6385;font-size:12px}.k{fill:#4a5bd8;font-weight:700}.a{stroke:#4a5bd8;stroke-width:2;fill:none;marker-end:url(#h)}.w{fill:#fff4e5;stroke:#e08a00;stroke-width:1.5}.g{fill:#e9f8ee;stroke:#2e9b57;stroke-width:1.5}</style>
