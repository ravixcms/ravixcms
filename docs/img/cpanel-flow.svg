<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 190" width="1180" height="190" font-family="system-ui,Segoe UI,Arial,sans-serif" font-size="14">
<style>.b{fill:#f4f6fb;stroke:#4a5bd8;stroke-width:1.5}.t{fill:#1c2340}.m{fill:#5b6385;font-size:12px}.k{fill:#4a5bd8;font-weight:700}.a{stroke:#4a5bd8;stroke-width:2;fill:none;marker-end:url(#h)}.w{fill:#fff4e5;stroke:#e08a00;stroke-width:1.5}.g{fill:#e9f8ee;stroke:#2e9b57;stroke-width:1.5}</style>
<defs><marker id="h" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4a5bd8"/></marker></defs>
<rect width="1180" height="190" fill="#fff"/><text class="t" x="20" y="26" font-weight="700">Install Ravix on cPanel: six steps</text><rect class="b" x="20" y="40" width="170" height="110" rx="10"/><text class="k" x="34" y="68" font-size="22">1</text><text class="t" x="34" y="94" font-weight="600">Setup Python App</text><text class="m" x="34" y="118">Python 3.11+, startup file p</text><text class="m" x="34" y="134">assenger_wsgi.py</text><path class="a" d="M190 95 H210"/><rect class="b" x="210" y="40" width="170" height="110" rx="10"/><text class="k" x="224" y="68" font-size="22">2</text><text class="t" x="224" y="94" font-weight="600">Upload + extract ZIP</text><text class="m" x="224" y="118">into the Application root</text><text class="m" x="224" y="134"></text><path class="a" d="M380 95 H400"/><rect class="b" x="400" y="40" width="170" height="110" rx="10"/><text class="k" x="414" y="68" font-size="22">3</text><text class="t" x="414" y="94" font-weight="600">Run Pip Install</text><text class="m" x="414" y="118">requirements-cpanel.txt</text><text class="m" x="414" y="134"></text><path class="a" d="M570 95 H590"/><rect class="b" x="590" y="40" width="170" height="110" rx="10"/><text class="k" x="604" y="68" font-size="22">4</text><text class="t" x="604" y="94" font-weight="600">MySQL database + user</text><text class="m" x="604" y="118">cPanel > MySQL Databases</text><text class="m" x="604" y="134"></text><path class="a" d="M760 95 H780"/><rect class="b" x="780" y="40" width="170" height="110" rx="10"/><text class="k" x="794" y="68" font-size="22">5</text><text class="t" x="794" y="94" font-weight="600">Open your site</text><text class="m" x="794" y="118">enter the install code, foll</text><text class="m" x="794" y="134">ow the steps</text><path class="a" d="M950 95 H970"/><rect class="g" x="970" y="40" width="170" height="110" rx="10"/><text class="k" x="984" y="68" font-size="22">6</text><text class="t" x="984" y="94" font-weight="600">Add the Cron line</text><text class="m" x="984" y="118">every 5 minutes: manage.py r</text><text class="m" x="984" y="134">avix_cron</text></svg>