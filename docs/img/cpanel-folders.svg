<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" width="760" height="330" font-family="system-ui,Segoe UI,Arial,sans-serif" font-size="14">
<style>.b{fill:#f4f6fb;stroke:#4a5bd8;stroke-width:1.5}.t{fill:#1c2340}.m{fill:#5b6385;font-size:12px}.k{fill:#4a5bd8;font-weight:700}.a{stroke:#4a5bd8;stroke-width:2;fill:none;marker-end:url(#h)}.w{fill:#fff4e5;stroke:#e08a00;stroke-width:1.5}.g{fill:#e9f8ee;stroke:#2e9b57;stroke-width:1.5}</style>
<defs><marker id="h" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4a5bd8"/></marker></defs>
<rect width="760" height="330" fill="#fff"/><text class="t" x="20" y="28" font-weight="700">Where things live (your home folder)</text>
<rect class="b" x="20" y="44" width="340" height="120" rx="8"/><text class="k" x="36" y="70">~/ravix/  (Application root)</text><text class="m" x="36" y="94">manage.py, passenger_wsgi.py, apps/, config/ ...</text><text class="m" x="36" y="114">replaced by updates; holds no secrets</text><text class="m" x="36" y="134">tmp/restart.txt restarts the app</text>
<rect class="g" x="400" y="44" width="340" height="190" rx="8"/><text class="k" x="416" y="70">~/ravix-data/  (private, never on the web)</text><text class="m" x="416" y="94">ravix.env (mode 600)  install-key.txt (until installed)</text><text class="m" x="416" y="114">installed.lock   db/ (SQLite)   backups/</text><text class="m" x="416" y="134">logs/   cache/   plugin_data/   update_backups/</text><text class="m" x="416" y="154">plugins_installed/   themes_installed/</text>
<rect class="w" x="20" y="190" width="340" height="110" rx="8"/><text class="k" x="36" y="216">~/public_html/  (the web)</text><text class="m" x="36" y="240">media/ (uploads, with a safe .htaccess)</text><text class="m" x="36" y="260">nothing else of Ravix is placed here</text>
<path class="a" d="M360 104 H400"/></svg>