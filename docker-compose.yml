# Ravix — Docker Compose:  ravix (Gunicorn) + PostgreSQL + Redis + Nginx + پشتیبان دوره‌ای.
#
#   آزمایش محلی (بدون پیکربندی):   docker compose up -d --build   →   http://localhost/install/
#   سرور واقعی:                    ./docker/init-env.sh example.com --tls   (رمزهای تصادفی در .env)
#                                  docker compose -f docker-compose.yml -f docker-compose.tls.yml up -d --build
# راهنمای کامل: docs/installer.md

name: ravix

x-ravix-env: &ravix-env
  DJANGO_SETTINGS_MODULE: config.settings.production
  DATABASE_URL: postgres://ravix:${POSTGRES_PASSWORD:-ravix}@db:5432/ravix
  REDIS_URL: redis://redis:6379/0
  DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-}          # خالی ⇒ یک‌بار ساخته و در /data/secret_key نگه داشته می‌شود
  DJANGO_ALLOWED_HOSTS: ${RAVIX_DOMAIN:-localhost},localhost,127.0.0.1
  DJANGO_CSRF_TRUSTED_ORIGINS: ${RAVIX_PUBLIC_URL:-http://localhost}
  DJANGO_SECURE_SSL_REDIRECT: ${DJANGO_SECURE_SSL_REDIRECT:-false}
  RAVIX_SITE_URL: ${RAVIX_PUBLIC_URL:-http://localhost}
  RAVIX_INSTALL_TOKEN: ${RAVIX_INSTALL_TOKEN:-}      # خالی ⇒ توکن تصادفی در لاگ و /data/install_token
  RAVIX_TRUST_PROXY_HEADERS: "true"                  # برنامه فقط از پشت nginx همین compose در دسترس است (X-Real-IP را nginx تعیین می‌کند)
  FORWARDED_ALLOW_IPS: "*"
  EMAIL_HOST: ${EMAIL_HOST:-localhost}
  EMAIL_HOST_USER: ${EMAIL_HOST_USER:-}
  EMAIL_HOST_PASSWORD: ${EMAIL_HOST_PASSWORD:-}

x-ravix-volumes: &ravix-volumes
  - ravix_data:/data
  - ravix_media:/data/media
  - ravix_backups:/backups

services:
  db:
    image: postgres:17-alpine     # نسخهٔ major باید با postgresql-client داخل Dockerfile (Debian trixie = 17) هم‌خوان یا بالاتر از آن باشد
    restart: unless-stopped
    environment:
      POSTGRES_USER: ravix
      POSTGRES_DB: ravix
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ravix}   # فقط هنگام ساخت اولیهٔ volume اعمال می‌شود. پورت دیتابیس بیرون منتشر نمی‌شود.
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ravix -d ravix"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine         # فقط کش/محدودسازی نرخ؛ داده‌ای که نباید از دست برود نگه نمی‌دارد
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "128mb", "--maxmemory-policy", "allkeys-lru"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  ravix:
    build: .
    image: ravix:${RAVIX_IMAGE_TAG:-local}
    restart: unless-stopped
    init: true
    environment: *ravix-env
    volumes: *ravix-volumes
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_healthy }
    expose: ["8000"]

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    environment:
      RAVIX_DOMAIN: ${RAVIX_DOMAIN:-localhost}
    ports:
      - "${RAVIX_HTTP_PORT:-80}:80"
    volumes:
      - ./docker/nginx/default.conf.template:/etc/nginx/templates/default.conf.template:ro
      - ./docker/nginx/ravix-proxy.conf:/etc/nginx/ravix-proxy.conf:ro
      - ravix_media:/srv/media:ro
    depends_on:
      ravix: { condition: service_healthy }

  backup:
    image: ravix:${RAVIX_IMAGE_TAG:-local}
    restart: unless-stopped
    init: true
    command: ["backup"]
    environment:
      <<: *ravix-env
      BACKUP_INTERVAL_HOURS: ${BACKUP_INTERVAL_HOURS:-24}
      KEEP_COUNT: ${KEEP_COUNT:-7}
    volumes: *ravix-volumes
    depends_on:
      ravix: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f backup-loop.sh >/dev/null"]
      interval: 60s
      timeout: 5s
      retries: 3

volumes:
  pgdata:
  ravix_data:
  ravix_media:
  ravix_backups:
