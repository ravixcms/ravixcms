# هدرهای پراکسی به برنامه (X-Real-IP را nginx تعیین می‌کند، نه کلاینت)
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Forwarded-Proto $ravix_proto;
proxy_redirect off;
proxy_read_timeout 60s;
proxy_pass http://ravix_app;
