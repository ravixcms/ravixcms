{% load i18n %}
{% load ravix_ui %}
<div class="field {% if field.errors %}has-error{% endif %}">
  <label for="{{ field.id_for_label }}">{{ field.label }}</label>
  <div class="md-editor" data-md-editor data-preview-url="{% url 'content:markdown_preview' %}">
    <div class="md-toolbar" role="toolbar" aria-label="{% trans "Formatting tools" %}">
      <button type="button" data-md="bold" title="{% trans "Bold" %}"><b>B</b></button>
      <button type="button" data-md="italic" title="{% trans "Italic" %}"><i>I</i></button>
      <button type="button" data-md="heading" title="{% trans "Title" %}">H</button>
      <button type="button" data-md="quote" title="{% trans "Quote" %}">“</button>
      <button type="button" data-md="ul" title="{% trans "Bulleted list" %}">{% icon "list" 16 %}</button>
      <button type="button" data-md="ol" title="{% trans "Numbered list" %}">{% trans "1." %}</button>
      <button type="button" data-md="link" title="{% trans "Link" %}">{% icon "globe" 16 %}</button>
      <button type="button" data-md="image" title="{% trans "Insert image by address" %}">{% icon "image" 16 %}</button>
      <button type="button" data-md="code" title="{% trans "Code" %}">&lt;/&gt;</button>
      <span class="md-tabs">
        <button type="button" class="active" data-md-tab="write">{% trans "Write" %}</button>
        <button type="button" data-md-tab="preview">{% trans "Preview" %}</button>
      </span>
    </div>
    {{ field }}
    <div class="md-preview prose" data-md-preview hidden></div>
  </div>
  <p class="help">{% trans "Markdown is used for writing. You can copy image addresses from the “Media” page." %}</p>
  {% for error in field.errors %}<p class="error-text">{{ error }}</p>{% endfor %}
</div>
