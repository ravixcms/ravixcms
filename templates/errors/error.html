{% extends "base.html" %}
{% load i18n %}
{% load ravix_ui %}
{% block title %}{{ title }}{% endblock %}
{% block body %}
<main class="error-page">
  <div>
    <div class="error-code">{{ status|fa_digits }}</div>
    <h1>{{ title }}</h1>
    <p class="muted">{{ message }}</p>
    <p><a class="btn" href="{% url 'public:home' %}">{% trans "Back to the main page" %}</a></p>
  </div>
</main>
{% endblock %}
