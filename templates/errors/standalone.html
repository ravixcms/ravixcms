<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
{% if refresh %}<meta http-equiv="refresh" content="{{ refresh }}">{% endif %}
<title>{{ title }}</title>
<style>
/* مستقل از فایل‌های static و دیتابیس: صفحهٔ خطا باید حتی وقتی همه‌چیز خراب است نمایش داده شود */
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:1.5rem;background:linear-gradient(160deg,#eef3fd,#f7f8fb);
  color:#1b1f27;font-family:Vazirmatn,Tahoma,"Segoe UI",sans-serif;line-height:1.9}
main{max-width:34rem;width:100%;background:#fff;border:1px solid #d6d9df;border-radius:16px;padding:2.5rem 1.75rem;text-align:center;
  box-shadow:0 10px 30px rgba(29,78,216,.08)}
.icon{font-size:3rem;line-height:1}
.code{font-size:clamp(3.5rem,14vw,5.5rem);font-weight:900;line-height:1.1;margin:.25rem 0;color:#1d4ed8}
h1{font-size:1.4rem;margin:.25rem 0}
p{margin:.5rem 0;color:#505763}
.btn{display:inline-block;margin-top:1.25rem;background:#1d4ed8;color:#fff;text-decoration:none;font-weight:700;padding:.45rem 1.4rem;border-radius:8px}
.btn:focus-visible{outline:3px solid #1d4ed8;outline-offset:3px}
.small{font-size:.85rem;margin-top:1.25rem}
</style>
</head>
<body>
<main role="alert">
  <div class="icon" aria-hidden="true">{{ icon }}</div>
  <div class="code" aria-hidden="true">{{ code }}</div>
  <h1>{{ title }}</h1>
  <p>{{ message }}</p>
  {% if refresh %}<p class="small">این صفحه خودکار تازه می‌شود.</p>{% else %}<a class="btn" href="/">بازگشت به صفحهٔ اصلی</a>{% endif %}
</main>
</body>
</html>
