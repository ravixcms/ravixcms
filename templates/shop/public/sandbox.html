{% load ravix_ui %}
<div class="alert" role="note" style="border-color:#8a5a10;color:inherit">⚠ این صفحهٔ <strong>درگاه پرداخت آزمایشی</strong> است و هیچ پولی جابه‌جا نمی‌شود.</div>
<p>سفارش {{ payment.order.number }} — مبلغ: <strong>{{ tx.amount|money }} {{ currency }}</strong></p>
{% if tx.state == 'pending' %}
<form method="post">{% csrf_token %}
<button class="btn btn-primary" name="action" value="pay" type="submit">شبیه‌سازی پرداخت موفق</button>
<button class="btn" name="action" value="fail" type="submit">شبیه‌سازی پرداخت ناموفق</button></form>
{% else %}<p>این تراکنش قبلاً نهایی شده است. <a href="{% url 'shop:callback' payment.reference %}">ادامه</a></p>{% endif %}
