{% if breadcrumbs %}
<nav class="crumbs" aria-label="مسیر صفحه">
  <ol>
    {% for crumb in breadcrumbs %}
    <li>{% if crumb.url %}<a href="{{ crumb.url }}">{{ crumb.label }}</a>{% else %}<span aria-current="page">{{ crumb.label }}</span>{% endif %}</li>
    {% endfor %}
  </ol>
</nav>
{% endif %}
