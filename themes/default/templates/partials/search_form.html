{% load i18n %}
{# پارامتر: input_id (شناسه یکتای فیلد)، query #}
<form class="search-form search-form-lg" role="search" action="{{ site.search_url }}" method="get">
  <label class="sr-only" for="{{ input_id }}">{% trans "Search phrase" %}</label>
  <input id="{{ input_id }}" type="search" name="q" value="{{ query }}" placeholder="{% trans "What are you looking for?" %}" maxlength="100" autocomplete="off">
  <button type="submit" class="btn">{% trans "Search" %}</button>
</form>
