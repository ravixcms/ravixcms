{# پارامتر: input_id (شناسه یکتای فیلد)، query #}
<form class="search-form search-form-lg" role="search" action="{{ site.search_url }}" method="get">
  <label class="sr-only" for="{{ input_id }}">عبارت جستجو</label>
  <input id="{{ input_id }}" type="search" name="q" value="{{ query }}" placeholder="دنبال چه می‌گردید؟" maxlength="100" autocomplete="off">
  <button type="submit" class="btn">جستجو</button>
</form>
