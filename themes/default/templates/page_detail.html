{% extends "base.html" %}
{% load i18n %}
{% load ravix_theme %}
{% block body_class %}page-static{% if page.builder %} page-built{% endif %}{% endblock %}
{% block content %}
{% if page.builder %}
{# A page made with the page builder: its body is full width and self-contained (safe HTML + its own <style>); the theme only renders the title and breadcrumbs. #}
{% if page.show_title %}
<div class="container">
  {% include "partials/breadcrumbs.html" %}
  <header class="article-head"><h1>{{ page.title }}</h1></header>
</div>
{% else %}<h1 class="sr-only">{{ page.title }}</h1>{% endif %}
{{ page.body_html }}
{% else %}
<div class="container">
  {% include "partials/breadcrumbs.html" %}
  <article class="article">
    <header class="article-head"><h1>{{ page.title }}</h1></header>
    <div class="prose">{{ page.body_html }}</div>
    <p class="muted updated">{% trans "Last updated:" %} <time datetime="{{ page.date_iso }}">{{ page.date_display }}</time></p>
  </article>
</div>
{% endif %}
{% endblock %}
